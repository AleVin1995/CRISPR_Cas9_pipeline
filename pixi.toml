[workspace]
authors = ["zxBIB Vinceti,Alessandro (CI CRM) EXTERNAL <alessandro.vinceti.ext@boehringer-ingelheim.com>"]
channels = ["conda-forge", "bioconda"]
name = "crispr_cas9_pipeline"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["activate.sh"]

[tasks]
install-crisprcleanr = "Rscript -e 'devtools::install_github(\"francescojm/CRISPRcleanR\")'"

[dependencies]
r-tidyverse = ">=2.0.0,<3"
r-base = ">=4.5.3,<4.6"
mageck = ">=0.5.9.5,<0.6"
r-devtools = ">=2.5.1,<3"
r-remotes = ">=2.5.0,<3"
bioconductor-shortread = ">=1.68.0,<2"
bioconductor-biostrings = ">=2.78.0,<3"
bioconductor-rsubread = ">=2.24.0,<3"
bioconductor-genomicalignments = ">=1.46.0,<2"
bioconductor-rqc = ">=1.44.0,<2"
pip = ">=26.0.1,<27"
python = ">=3.12.13,<3.13"
click = ">=8.3.3,<9"
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
bioconductor-rsamtools = ">=2.26.0,<3"
openssl = ">=3.2.0"
