[workspace]
name = "crispr_cas9_pipeline"
version = "1.0.0"
description = "CRISPR Cas9 pipeline environment"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12.13,<3.13"
pip = ">=26.0.1,<27"
r-base = ">=4.5.3,<4.6"
mageck = ">=0.5.9.5,<0.6"
r-tidyverse = ">=2.0.0,<3"
r-devtools = ">=2.5.1,<3"
r-remotes = ">=2.5.0,<3"
bioconductor-shortread = ">=1.68.0,<2"
bioconductor-biostrings = ">=2.78.0,<3"
bioconductor-rsubread = ">=2.24.0,<3"
bioconductor-genomicalignments = ">=1.46.0,<2"
bioconductor-rqc = ">=1.44.0,<2"
bioconductor-rsamtools = ">=2.26.0,<3"
click = ">=8.3.3,<9"
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
openssl = ">=3.2.0"
nf-test = ">=0.9.5,<0.10"

[tasks]
setup-r-packages = "Rscript -e 'options(download.file.method=\"curl\", timeout=300); remotes::install_github(\"francescojm/CRISPRcleanR\", upgrade=\"never\"); remotes::install_github(\"DepMap-Analytics/CoRe\", upgrade=\"never\")'"
